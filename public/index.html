    if (openCollection && openCollection.id === id) loadPage(currentStart);
    refreshPanelIfOpen();
  }

  let maxCollectionItems = 1000;  // from the server, with each list of collections

  // A menu of collections to add to, or a new one to create. add(id) does the adding.
  async function openBulkMenu(wrap, title, add) {
    closeCollectMenus();
    const menu = document.createElement('div');
    menu.className = 'collect-menu';
    menu.innerHTML = '<em>Loading…</em>';
    wrap.appendChild(menu);
    const addTo = async (collection, where) => {
      where.querySelectorAll('button').forEach(b => { b.disabled = true; });
      try {
        const result = await add(collection.id);
        closeCollectMenus();
        showBulkResult(collection, result);
        collectionChanged(collection.id);
      } catch (err) {
        where.querySelectorAll('button').forEach(b => { b.disabled = false; });
        showInlineError(menu, err.message);
      }
    };
    try {
      const data = await collectionsApi('GET', '/api/collections');
      maxCollectionItems = data.max_items || maxCollectionItems;
      menu.innerHTML = '';
      const heading = document.createElement('div');
      heading.className = 'menu-title';
      heading.textContent = title();
      menu.appendChild(heading);
      for (const c of data.collections) {
        const choice = document.createElement('button');
        choice.type = 'button';
        choice.className = 'bulk-choice';
        choice.innerHTML = `<span>${escapeHtml(c.name)}</span><span class="count">${c.count}</span>`;
        choice.addEventListener('click', () => addTo(c, menu));
        menu.appendChild(choice);
      }
      const form = document.createElement('form');
      form.className = 'collection-new';
      form.innerHTML = '<input type="text" placeholder="New collection" maxlength="100" autocomplete="off"><button type="submit">Add</button>';
      form.addEventListener('submit', async e => {
        e.preventDefault();
        const name = form.querySelector('input').value.trim();
        if (!name) return;
        try {
          addTo(await collectionsApi('POST', '/api/collections', { name }), menu);
        } catch (err) { showInlineError(form, err.message); }
      });
      menu.appendChild(form);
    } catch (err) {
      menu.innerHTML = `<em>${escapeHtml(err.message)}</em>`;
    }
  }

  function toggleBulkMenu(button, title, add) {
    const wrap = button.parentElement;
    if (wrap.querySelector('.collect-menu')) closeCollectMenus();
    else openBulkMenu(wrap, title, add);
  }

  selectAddBtn.addEventListener('click', () => {
    toggleBulkMenu(selectAddBtn, () => `Add ${plural(selectedDocs.size, 'selected result')} to:`, async id => {
      const result = await collectionsApi('POST', `/api/collections/${id}/items/bulk`, { ids: [...selectedDocs] });
      selectedDocs.clear();
      pageChecks().forEach(c => setChecked(c, false));
      return result;
    });
  });
  selectAddAllBtn.addEventListener('click', () => {
    const params = currentFilterParams();
    params.set('q', currentQuery);
    if (searchMode !== 'keyword') params.set('mode', searchMode);
    toggleBulkMenu(selectAddAllBtn, () => `Add all ${plural(currentTotal, 'result')} to:`
      + (currentTotal > maxCollectionItems ? ` A collection holds up to ${maxCollectionItems.toLocaleString()}, so the best matches go in first.` : ''),
      id => collectionsApi('POST', `/api/collections/${id}/items/from-search?${params}`));
  });

  // A collection, or documents like it, in the results list.
  function renderBanner() {
    collectionBanner.hidden = false;
    timelineEl.hidden = collectionView !== 'timeline';
    const views = [['items', 'Items'], ['timeline', 'Timeline'],
                   ...(semanticAvailable ? [['semantic', 'More like these: semantic']] : []),
                   ['keyword', 'More like these: keyword']];
    collectionBanner.innerHTML = `<span class="banner-title">Collection: <strong>${escapeHtml(openCollection.name)}</strong></span>
      <div class="banner-views">${views.map(([v, label]) =>
        `<button type="button" data-view="${v}" class="${v === collectionView ? 'active' : ''}">${label}</button>`).join('')}</div>
      <button type="button" class="banner-download" title="Download this collection's files as one zip">&#8595; Download all</button>
      <button type="button" class="banner-back">Back to search</button>
      ${openCollection.description ? `<div class="banner-desc">${escapeHtml(openCollection.description)}</div>` : ''}`;
    collectionBanner.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
      if (b.dataset.view === 'items') showCollection(openCollection, 0);
      else if (b.dataset.view === 'timeline') { resetTimelineZoom(); showTimeline(0); }
      else showSimilar(b.dataset.view, 0);
    }));
    collectionBanner.querySelector('.banner-download').addEventListener('click', e => downloadCollection(e.currentTarget));
    collectionBanner.querySelector('.banner-back').addEventListener('click', backToSearch);
  }

  // The summary first: it reports anything that would stop the download, which
  // the browser wouldn't show for a link. The link then leaves this page as it is.
  async function downloadCollection(button) {
    const url = `/api/collections/${openCollection.id}/download`;
    clearInlineError(collectionBanner);
    collectionBanner.querySelector('.banner-note')?.remove();
    button.disabled = true;
    try {
      const { files, linked, bytes } = await collectionsApi('GET', `${url}/summary`);
      const link = document.createElement('a');
      link.href = url;
      link.click();
      const note = document.createElement('div');
      note.className = 'banner-note';
      const size = bytes >= 1024 * 1024 ? `${Math.ceil(bytes / 1024 / 1024).toLocaleString()} MB` : `${Math.ceil(bytes / 1024).toLocaleString()} KB`;
      note.textContent = `Downloading ${files.toLocaleString()} file${files === 1 ? '' : 's'} as a zip, about ${size} before compression. `
        + `The browser can't show how far along it is, and it may take a while.`
        + (linked ? ` ${linked.toLocaleString()} item${linked === 1 ? ' isn\'t a file, so it\'s' : 's aren\'t files, so they\'re'} listed with links in _not-included.txt in the zip.` : '');
      collectionBanner.appendChild(note);
    } catch (err) {
      showInlineError(collectionBanner, err.message);
    } finally {
      button.disabled = false;
    }
  }

  async function showView(url, start, describe, emptyHtml) {
    currentStart = start;
    metaRow.textContent = 'Loading…';
    try {
      const data = await collectionsApi('GET', `${url}${url.includes('?') ? '&' : '?'}start=${start}&rows=${ROWS_PER_PAGE}`);
      currentTotal = data.numFound;
      // Picks up a name or description changed elsewhere (another tab).
      if (data.collection && openCollection && data.collection.id === openCollection.id
          && (data.collection.name !== openCollection.name || data.collection.description !== openCollection.description)) {
        Object.assign(openCollection, { name: data.collection.name, description: data.collection.description });
        renderBanner();
      }
      const shown = data.numFound ? ` — showing ${start + 1}–${Math.min(start + ROWS_PER_PAGE, data.numFound)}` : '';
      metaRow.innerHTML = `<span class="status-dot ok"></span>${describe(data)}${shown}`;
      renderResults(data, emptyHtml);
    } catch (err) {
      metaRow.innerHTML = `<span class="status-dot err"></span>${escapeHtml(err.message)}`;
      resultsEl.innerHTML = '';
      pager.style.display = 'none';
      updateSelectBar();
    }
  }

  function showCollection(c, start) {
    const switched = !openCollection || openCollection.id !== c.id;
    openCollection = c;
    collectionView = 'items';
    renderBanner();
    if (switched) refreshPanelIfOpen();
    loadPage = s => showCollection(openCollection, s);
    return showView(`/api/collections/${c.id}`, start, data => {
      const n = data.numFound;
      return `${n.toLocaleString()} document${n === 1 ? '' : 's'}`
        + (data.hidden ? ` (${data.hidden} more you can no longer see)` : '');
    }, '<div class="empty-state"><div class="big">// empty collection</div>Add results to it with "+ Collection" on any result.</div>');
  }

  function resetTimelineZoom() {
    timelineRange = null;
    timelineHistory = [];
  }

  function showTimeline(start) {
    collectionView = 'timeline';
    renderBanner();
    loadPage = showTimeline;
    const range = timelineRange ? `?from=${timelineRange.from}&to=${timelineRange.to}` : '';
    return showView(`/api/collections/${openCollection.id}/timeline${range}`, start, data => {
      if (collectionView === 'timeline') renderTimeline(data);
      const n = data.numFound;
      return `${n.toLocaleString()} document${n === 1 ? '' : 's'}, oldest first`
        + (data.hidden ? ` (${data.hidden} more you can no longer see)` : '');
    }, timelineRange
      ? '<div class="empty-state"><div class="big">// nothing in this period</div>Choose "Back" or "Reset View" to see more of the timeline.</div>'
      : '<div class="empty-state"><div class="big">// empty collection</div>Add results to it with "+ Collection" on any result.</div>');
  }

  // A bucket's name; periods are UTC, so they're formatted as UTC too.
  function timelineLabel(bucket, unit) {
    const date = new Date(`${bucket.start}T00:00:00Z`);
    const fmt = opts => date.toLocaleDateString(undefined, { timeZone: 'UTC', ...opts });
    if (unit === 'day') return fmt({ year: 'numeric', month: 'short', day: 'numeric' });
    if (unit === 'month') return fmt({ year: 'numeric', month: 'short' });
    return unit === 'decade' ? `${bucket.start.slice(0, 4)}s` : bucket.start.slice(0, 4);
  }

  // The chart above the list: a square per period (like a contribution graph)
  // or a bar per period, whichever this browser last chose. Clicking one or
  // dragging across several zooms the chart and the list in on that range.
  function renderTimeline(data) {
    timelineData = data;
    const squares = timelineShape === 'squares' ? squaresModel(data) : null;
    const unit = squares ? squares.unit : data.unit;
    const dated = data.buckets.reduce((sum, b) => sum + b.count, 0);
    const undatedNote = data.undated ? ` · ${data.undated} undated${timelineRange ? ' (not shown)' : ', listed last'}` : '';
    const periodUnit = zoomedPeriodUnit();
    const steps = periodUnit ? adjacentPeriods(data.all_days || [], periodUnit) : {};
    const periodName = range => escapeHtml(timelineLabel({ start: range.from }, periodUnit));
    timelineEl.innerHTML = `<div class="timeline-head">
        <span>${periodUnit ? `<span class="timeline-period">${periodName(timelineRange)}</span> · ` : ''}${dated.toLocaleString()} dated document${dated === 1 ? '' : 's'} by ${unit || 'date'}${undatedNote}</span>
        <div class="timeline-actions">
          ${steps.previous ? `<button type="button" class="timeline-previous" title="The previous ${periodUnit} with documents">&larr; ${periodName(steps.previous)}</button>` : ''}
          ${steps.next ? `<button type="button" class="timeline-next" title="The next ${periodUnit} with documents">${periodName(steps.next)} &rarr;</button>` : ''}
          ${[['squares', 'Squares'], ['bars', 'Bars']].map(([shape, label]) =>
            `<button type="button" data-shape="${shape}" class="${shape === timelineShape ? 'active' : ''}">${label}</button>`).join('')}
          ${timelineRange ? `<button type="button" class="timeline-back">&larr; Back</button>
            <button type="button" class="timeline-reset">Reset View</button>` : ''}
        </div>
      </div>`;
    timelineEl.querySelectorAll('[data-shape]').forEach(b => b.addEventListener('click', () => {
      timelineShape = b.dataset.shape;
      savePref(TIMELINE_SHAPE_KEY, timelineShape);
      renderTimeline(timelineData);
    }));
    // Moving along stays at the same zoom level, so it isn't another step for Back.
    [['.timeline-previous', steps.previous], ['.timeline-next', steps.next]].forEach(([selector, range]) => {
      if (!range) return;
      timelineEl.querySelector(selector).addEventListener('click', () => {
        timelineRange = range;
        showTimeline(0);
      });
    });
    if (timelineRange) {
      timelineEl.querySelector('.timeline-back').addEventListener('click', () => {
        timelineRange = timelineHistory.pop() || null;
        showTimeline(0);
      });
      timelineEl.querySelector('.timeline-reset').addEventListener('click', () => {
        resetTimelineZoom();
        showTimeline(0);
      });
    }
    if (!data.buckets.length) return;
    if (squares) renderSquares(squares);
    else renderBars(data);
  }

  const docCount = n => `${n.toLocaleString()} document${n === 1 ? '' : 's'}`;

  function zoomTimeline(range) {
    if (timelineRange && timelineRange.from === range.from && timelineRange.to === range.to) return;
    timelineHistory.push(timelineRange);
    timelineRange = range;
    showTimeline(0);
  }

  // The day, month, year or decade starting on a date, as { from, to }.
  function periodRange(start, unit) {
    const year = Number(start.slice(0, 4));
    if (unit === 'day') return { from: start, to: addDays(start, 1) };
    if (unit === 'year') return { from: start, to: `${isoYear(year + 1)}-01-01` };
    if (unit === 'decade') return { from: start, to: `${isoYear(year + 10)}-01-01` };
    const month = Number(start.slice(5, 7));
    return { from: start, to: month === 12 ? `${isoYear(year + 1)}-01-01` : `${isoYear(year)}-${String(month + 1).padStart(2, '0')}-01` };
  }

  function periodStart(date, unit) {
    if (unit === 'day') return date;
    if (unit === 'month') return `${date.slice(0, 7)}-01`;
    const year = Number(date.slice(0, 4));
    return `${isoYear(unit === 'decade' ? year - year % 10 : year)}-01-01`;
  }

  // Which whole period the current zoom is, if it's exactly one (a drag can
  // cover any stretch of dates, which has no obvious next one).
  function zoomedPeriodUnit() {
    if (!timelineRange) return null;
    return ['day', 'month', 'year', 'decade'].find(unit =>
      periodStart(timelineRange.from, unit) === timelineRange.from
        && periodRange(timelineRange.from, unit).to === timelineRange.to) || null;
  }

  // The nearest periods of the same kind that have documents, so that moving
  // through a sparse collection doesn't land on blank views.
  function adjacentPeriods(allDays, unit) {
    const before = allDays.filter(d => d < timelineRange.from).pop();
    const after = allDays.find(d => d >= timelineRange.to);
    const range = date => date ? periodRange(periodStart(date, unit), unit) : null;
    return { previous: range(before), next: range(after) };
  }

  // Click or drag across a chart's [data-index] elements (periods, in date
  // order) to zoom in on them. A drag is a continuous run of dates, so on the
  // squares it wraps from one row to the next.
  function makeZoomable(chart, periods, unit) {
    const zoomTo = (a, b) => {
      const [first, last] = [periods[Math.min(a, b)], periods[Math.max(a, b)]];
      // A whole chart of days can't go any finer.
      if (unit === 'day' && first === periods[0] && last === periods[periods.length - 1]) return;
      // Nor is there anything to see in a stretch with no documents.
      if (!periods.slice(Math.min(a, b), Math.max(a, b) + 1).some(p => p.count)) return;
      zoomTimeline({ from: first.start, to: last.end });
    };
    const indexAt = e => {
      const el = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-index]');
      return el && chart.contains(el) ? Number(el.dataset.index) : null;
    };
    let dragFrom = null;
    let dragTo = null;
    const markSelection = () => {
      const [lo, hi] = dragFrom === null ? [1, 0] : [Math.min(dragFrom, dragTo), Math.max(dragFrom, dragTo)];
      chart.querySelectorAll('[data-index]').forEach(el => {
        const i = Number(el.dataset.index);
        el.classList.toggle('selecting', i >= lo && i <= hi);
      });
    };
    chart.addEventListener('pointerdown', e => {
      const i = indexAt(e);
      if (i === null || e.button !== 0) return;
      dragFrom = dragTo = i;
      chart.setPointerCapture(e.pointerId);
      markSelection();
    });
    chart.addEventListener('pointermove', e => {
      if (dragFrom === null) return;
      const i = indexAt(e);
      if (i !== null) dragTo = i;
      markSelection();
    });
    chart.addEventListener('pointerup', () => {
      if (dragFrom === null) return;
      const [a, b] = [dragFrom, dragTo];
      dragFrom = dragTo = null;
      markSelection();
      zoomTo(a, b);
    });
    chart.addEventListener('pointercancel', () => {
      dragFrom = dragTo = null;
      markSelection();
    });
    // Enter or Space on a focused period; pointer clicks are handled above.
    chart.addEventListener('click', e => {
      const el = e.target.closest('[data-index]');
      if (el && e.detail === 0) zoomTo(Number(el.dataset.index), Number(el.dataset.index));
    });
  }

  function timelineHint(text) {
    const hint = document.createElement('div');
    hint.className = 'timeline-hint';
    hint.textContent = text;
    return hint;
  }

  function renderBars(data) {
    const { buckets, unit } = data;
    const peak = Math.max(...buckets.map(b => b.count));
    const bars = document.createElement('div');
    bars.className = 'timeline-bars';
    buckets.forEach((b, i) => {
      const label = `${timelineLabel(b, unit)}: ${docCount(b.count)}`;
      const bar = document.createElement('button');
      bar.type = 'button';
      bar.className = 'timeline-bar';
      bar.dataset.index = i;
      bar.title = label;
      bar.setAttribute('aria-label', label);
      if (b.count) {
        const mark = document.createElement('span');
        mark.className = 'mark';
        // A floor so that one document among thousands still shows.
        mark.style.height = `max(3px, ${(b.count / peak) * 100}%)`;
        bar.appendChild(mark);
      }
      bars.appendChild(bar);
    });
    makeZoomable(bars, buckets, unit);

    const axis = document.createElement('div');
    axis.className = 'timeline-axis';
    axis.innerHTML = `<span>${escapeHtml(timelineLabel(buckets[0], unit))}</span>`
      + (buckets.length > 1 ? `<span>${escapeHtml(timelineLabel(buckets[buckets.length - 1], unit))}</span>` : '');
    timelineEl.append(bars, axis, timelineHint(`Tallest bar: ${docCount(peak)}. Click a bar or drag across several to zoom in.`));
  }

  const DAY_MS = 24 * 60 * 60 * 1000;
  const isoYear = y => String(y).padStart(4, '0');
  const addDays = (iso, n) => {
    const d = new Date(`${iso}T00:00:00Z`);
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  };
  const SQUARES_MAX_MONTH_ROWS = 40;

  // Up to a year: a square per day, in week columns. Longer: a row per year
  // with a square per month. Longer still: a row per decade with a square per
  // year. Zoomed in, the grid covers the whole chosen range, not just the part
  // with documents. Each cell has its row and column, and start and end dates.
  function squaresModel(data) {
    const days = data.days || [];
    if (!days.length) return null;
    const first = timelineRange ? timelineRange.from : days[0].date;
    const last = timelineRange ? addDays(timelineRange.to, -1) : days[days.length - 1].date;
    const [y0, y1] = [Number(first.slice(0, 4)), Number(last.slice(0, 4))];
    const span = (Date.parse(last) - Date.parse(first)) / DAY_MS;
    const unit = span <= 366 ? 'day' : y1 - y0 <= SQUARES_MAX_MONTH_ROWS ? 'month' : 'year';
    const keyLength = { day: 10, month: 7, year: 4 }[unit];
    const counts = new Map();
    days.forEach(d => {
      const key = d.date.slice(0, keyLength);
      counts.set(key, (counts.get(key) || 0) + d.count);
    });

    const cells = [];
    const add = (start, end, row, col) => cells.push({ start, end, row, col, count: counts.get(start.slice(0, keyLength)) || 0 });
    if (unit === 'day') {
      const lead = new Date(Date.parse(first)).getUTCDay();
      for (let d = first; d <= last; d = addDays(d, 1)) {
        const offset = Math.round((Date.parse(d) - Date.parse(first)) / DAY_MS);
        add(d, addDays(d, 1), new Date(Date.parse(d)).getUTCDay(), Math.floor((offset + lead) / 7));
      }
    } else if (unit === 'month') {
      const lastMonth = last.slice(0, 7);
      for (let y = y0; y <= y1; y++) {
        for (let m = 1; m <= 12; m++) {
          const month = `${isoYear(y)}-${String(m).padStart(2, '0')}`;
          if (month < first.slice(0, 7) || month > lastMonth) continue;
          const next = m === 12 ? `${isoYear(y + 1)}-01` : `${isoYear(y)}-${String(m + 1).padStart(2, '0')}`;
          add(`${month}-01`, `${next}-01`, y - y0, m - 1);
        }
      }
    } else {
      for (let y = y0; y <= y1; y++) {
        add(`${isoYear(y)}-01-01`, `${isoYear(y + 1)}-01-01`, Math.floor(y / 10) - Math.floor(y0 / 10), y % 10);
      }
    }
    return { unit, cells, y0 };
  }

  // Shades by rank among the periods with documents, as quarters, so that one
  // very busy period doesn't leave all the others in the palest shade.
  function shadeLevels(cells) {
    const sorted = cells.map(c => c.count).filter(Boolean).sort((a, b) => a - b);
    return count => {
      if (!count) return 0;
      const atOrBelow = sorted.filter(n => n <= count).length;
      return Math.ceil((atOrBelow / sorted.length) * 4);
    };
  }

  function renderSquares({ unit, cells, y0 }) {
    const utc = (iso, opts) => new Date(`${iso}T00:00:00Z`).toLocaleDateString(undefined, { timeZone: 'UTC', ...opts });
    const rows = Math.max(...cells.map(c => c.row)) + 1;
    const cols = Math.max(...cells.map(c => c.col)) + 1;
    const grid = document.createElement('div');
    grid.className = `timeline-squares unit-${unit}`;
    const size = unit === 'day' ? 'minmax(10px, 20px)' : 'var(--square)';
    grid.style.gridTemplateColumns = `auto repeat(${cols}, ${size})`;
    grid.style.gridTemplateRows = `auto repeat(${rows}, ${unit === 'day' ? 'auto' : size})`;
    // period: the { start, unit } a label opens, if it has documents to show.
    const addLabel = (text, row, col, cls, period) => {
      let range = period ? periodRange(period.start, period.unit) : null;
      if (range && !cells.some(c => c.count && c.start >= range.from && c.start < range.to)) range = null;
      if (range && timelineRange && range.from === timelineRange.from && range.to === timelineRange.to) range = null;
      const el = document.createElement(range ? 'button' : 'div');
      el.className = `timeline-square-label ${cls}`;
      el.textContent = text;
      if (range) {
        el.type = 'button';
        el.title = `Open ${text}`;
        el.addEventListener('click', () => zoomTimeline(range));
      }
      el.style.gridRow = row + 2;
      el.style.gridColumn = col + 2;
      grid.appendChild(el);
    };

    if (unit === 'day') {
      // Sunday-first rows, as the week columns are; Monday, Wednesday, Friday named.
      [[1, '2024-01-01'], [3, '2024-01-03'], [5, '2024-01-05']].forEach(([row, sample]) => {
        addLabel(utc(sample, { weekday: 'short' }), row, -1, 'row');
      });
      // A month's name over the week it starts in, if there's room for it.
      let lastLabelled = -3;
      cells.forEach(c => {
        const startsMonth = c.start.endsWith('-01') || c === cells[0];
        if (!startsMonth || c.col - lastLabelled < 3) return;
        const month = periodStart(c.start, 'month');
        addLabel(utc(c.start, { month: 'short' }), -1, c.col, 'col', { start: month, unit: 'month' });
        lastLabelled = c.col;
      });
    } else if (unit === 'month') {
      for (let m = 0; m < 12; m++) {
        addLabel(utc(`2024-${String(m + 1).padStart(2, '0')}-01`, { month: 'narrow' }), -1, m, 'col');
      }
      for (let r = 0; r < rows; r++) addLabel(isoYear(y0 + r), r, -1, 'row', { start: `${isoYear(y0 + r)}-01-01`, unit: 'year' });
    } else {
      for (let y = 0; y < 10; y++) addLabel(String(y), -1, y, 'col');
      for (let r = 0; r < rows; r++) {
        const decade = isoYear((Math.floor(y0 / 10) + r) * 10);
        addLabel(`${decade}s`, r, -1, 'row', { start: `${decade}-01-01`, unit: 'decade' });
      }
    }

    const level = shadeLevels(cells);
    cells.forEach((c, i) => {
      const label = `${timelineLabel(c, unit)}: ${docCount(c.count)}`;
      const square = document.createElement('button');
      square.type = 'button';
      const monthEnd = unit === 'day' && addDays(c.start, 1).endsWith('-01');
      square.className = `timeline-square shade-${level(c.count)}${monthEnd ? ' month-end' : ''}`;
      square.dataset.index = i;
      square.title = label;
      square.setAttribute('aria-label', label);
      // One tab stop for the whole grid; the arrow keys move within it.
      square.tabIndex = i === 0 ? 0 : -1;
      square.style.gridRow = c.row + 2;
      square.style.gridColumn = c.col + 2;
      grid.appendChild(square);
    });
    grid.addEventListener('keydown', e => {
      const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
      const el = e.target.closest('[data-index]');
      if (!step || !el) return;
      const next = grid.querySelector(`[data-index="${Number(el.dataset.index) + step}"]`);
      if (!next) return;
      e.preventDefault();
      el.tabIndex = -1;
      next.tabIndex = 0;
      next.focus();
    });
    makeZoomable(grid, cells, unit);

    const scroll = document.createElement('div');
    scroll.className = 'timeline-scroll';
    scroll.appendChild(grid);
    const foot = document.createElement('div');
    foot.className = 'timeline-foot';
    foot.append(timelineHint(`Click a square or a ${unit === 'day' ? 'month' : unit === 'month' ? 'year' : 'decade'}, or drag across several squares, to zoom in. Hover for the count.${unit === 'day' ? ' Hexagons mark the last day of each month.' : ''}`));
    const legend = document.createElement('div');
    legend.className = 'timeline-legend';
    legend.innerHTML = `Less ${[0, 1, 2, 3, 4].map(n => `<span class="timeline-square shade-${n}"></span>`).join('')} More`;
    foot.append(legend);
    timelineEl.append(scroll, foot);
  }

  function showSimilar(mode, start) {
    collectionView = mode;
    renderBanner();
    loadPage = s => showSimilar(mode, s);
    return showView(`/api/collections/${openCollection.id}/similar?mode=${mode}`, start, data => {
      const sources = [
        ...(data.examples ? [`the ${data.examples} most recently added item${data.examples === 1 ? '' : 's'}`] : []),
        ...(data.description_used ? ['the description'] : []),
      ];
      return `${data.numFound.toLocaleString()} document${data.numFound === 1 ? '' : 's'} like `
        + `${sources.join(' and ') || 'nothing yet'} (${mode})`;
    },
    '<div class="empty-state"><div class="big">// nothing similar found</div>Add more documents to the collection, or try the other kind of search.</div>');
  }

  function leaveCollectionView() {
    const was = openCollection;
    openCollection = null;
    collectionView = null;
    collectionBanner.hidden = true;
    timelineEl.hidden = true;
    resetTimelineZoom();
    loadPage = s => runSearch(currentQuery, s);
    if (was) refreshPanelIfOpen();
  }

  function backToSearch() {
    leaveCollectionView();
    if (hasSearched) runSearch(currentQuery, 0);
    else {
      resultsEl.innerHTML = '<div class="empty-state"><div class="big">// ready</div>Enter a search term above to query the index.</div>';
      metaRow.textContent = '';
      pager.style.display = 'none';
      updateSelectBar();
    }
  }
</script>
</body>
</html>
