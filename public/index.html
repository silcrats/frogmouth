<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frogmouth Search</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f25;
    --border: #2a2e36;
    --text: #e6e8eb;
    --text-dim: #8b909c;
    --accent: #5fb3a3;
    --accent-dim: #3d7a70;
    --mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  .shell {
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }

  header {
    margin-bottom: 32px;
  }

  .label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  h1 {
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 14px;
  }

  form.search-form {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  input[type="text"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 15px;
    padding: 13px 16px;
    border-radius: 6px;
    font-family: var(--sans);
    transition: border-color 0.15s ease;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent-dim);
  }

  input[type="text"]::placeholder {
    color: var(--text-dim);
  }

  button {
    background: var(--accent);
    color: #0d1210;
    border: none;
    font-weight: 600;
    font-size: 14px;
    padding: 0 22px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover { background: #6fc2b2; }
  button:disabled { background: var(--border); color: var(--text-dim); cursor: default; }

  .meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    margin: 18px 0 20px;
    min-height: 16px;
  }

  .page-size-control {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .page-size-control select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
  }

  .page-size-control select:focus {
    outline: none;
    border-color: var(--accent-dim);
  }

  .results {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .result {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
    margin-bottom: 10px;
    transition: border-color 0.15s ease;
  }

  .result.open {
    border-color: var(--accent-dim);
  }

  .result-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 6px;
  }

  .result-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    word-break: break-word;
  }

  .result-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .expand-btn,
  .download-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: border-color 0.15s ease, color 0.15s ease;
    text-decoration: none;
  }

  .expand-btn:hover,
  .download-btn:hover {
    color: var(--accent);
    border-color: var(--accent-dim);
  }

  .expand-btn .expand-caret {
    display: inline-block;
    transition: transform 0.15s ease;
    font-size: 10px;
  }

  .result.open .expand-btn {
    color: var(--accent);
    border-color: var(--accent-dim);
  }

  .result.open .expand-btn .expand-caret {
    transform: rotate(90deg);
  }

  .result-detail {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .detail-grid {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 6px 16px;
    margin-bottom: 16px;
    font-size: 12.5px;
  }

  .detail-label {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    white-space: nowrap;
    padding-top: 1px;
  }

  .detail-value {
    color: var(--text);
    word-break: break-word;
    white-space: pre-line; /* so a multi-line value (e.g. Attachments, one per line) actually breaks visually */
  }

  .detail-body-label {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .detail-body {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 480px;
    overflow-y: auto;
  }

  .detail-body mark {
    background: rgba(95, 179, 163, 0.25);
    color: var(--text);
    padding: 0 2px;
    border-radius: 2px;
  }

  .result-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .result-meta span {
    background: rgba(95, 179, 163, 0.1);
    padding: 2px 8px;
    border-radius: 4px;
  }

  .result-snippet {
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text-dim);
  }

  .result-snippet mark {
    background: rgba(95, 179, 163, 0.25);
    color: var(--text);
    padding: 0 2px;
    border-radius: 2px;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    font-size: 14px;
  }

  .empty-state .big {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent-dim);
    margin-bottom: 10px;
  }

  .pager {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 28px;
  }

  .app-version {
    margin-top: 40px;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }

  .pager button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    font-weight: 500;
    padding: 8px 18px;
  }

  .pager button:hover:not(:disabled) { border-color: var(--accent-dim); }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 4px;
  }

  .filters.hidden { display: none; }

  #filterRows {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1 1 100%;
    width: 100%;
  }

  .filter-controls-row {
    display: flex;
    align-items: center;
    gap: 16px;
    flex: 1 1 100%;
    width: 100%;
  }

  .filter-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .filter-row select.field-select {
    min-width: 90px;
    flex-shrink: 0;
  }

  .filter-row select.not-select {
    flex-shrink: 0;
  }

  .filter-value {
    width: 100% !important;
    min-width: 0;
    box-sizing: border-box;
  }

  .filter-value-wrap {
    flex: 1 1 0%;
    min-width: 0;
    display: block;
  }

  .remove-row {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 14px;
    width: 34px;
    height: 34px;
    border-radius: 6px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .remove-row:hover { color: #c96a5a; border-color: #c96a5a; }

  .add-row-btn {
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--text-dim);
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    align-self: flex-start;
    font-family: var(--mono);
  }

  .add-row-btn:hover { color: var(--accent); border-color: var(--accent-dim); }

  .logic-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    margin: 2px 0;
  }

  .logic-toggle .switch {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .logic-toggle button {
    background: var(--panel);
    color: var(--text-dim);
    border: none;
    font-size: 11px;
    font-family: var(--mono);
    padding: 5px 12px;
    cursor: pointer;
  }

  .logic-toggle button.active {
    background: var(--accent);
    color: #0d1210;
    font-weight: 700;
  }

  .date-row {
    display: flex;
    gap: 8px;
  }

  .filter-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .filter-field label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .filters select,
  .filters input[type="date"],
  .filters input[type="text"] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 6px;
    font-family: var(--sans);
  }

  .filters select:focus,
  .filters input:focus {
    outline: none;
    border-color: var(--accent-dim);
  }

  .filter-toggle {
    background: transparent;
    color: var(--text-dim);
    border: none;
    font-size: 12px;
    padding: 4px 0;
    margin-bottom: 14px;
    cursor: pointer;
    text-align: left;
    font-family: var(--mono);
  }

  .filter-toggle:hover { color: var(--accent); }

  .filter-toggle .count {
    display: inline-block;
    background: var(--accent);
    color: #0d1210;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 10px;
    margin-left: 6px;
  }

  .clear-filters {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    align-self: flex-end;
  }

  .clear-filters:hover { color: var(--text); border-color: var(--accent-dim); }

  .status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 6px;
    background: var(--text-dim);
  }

  .status-dot.ok { background: var(--accent); }
  .status-dot.err { background: #c96a5a; }

  /* Collections */
  .header-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    font-size: 11px; font-family: var(--mono); padding: 5px 10px; border-radius: 6px; cursor: pointer;
  }
  .header-btn:hover, .header-btn.active { color: var(--accent); border-color: var(--accent-dim); }
  .collections-panel, .collection-banner {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 14px; font-size: 13px;
  }
  .collections-panel[hidden], .collection-banner[hidden] { display: none; }
  .collection-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .collection-row .collection-open {
    flex: 1; text-align: left; background: none; border: none; color: var(--text);
    font: inherit; cursor: pointer; padding: 4px 0;
  }
  .collection-row .collection-open:hover { color: var(--accent); }
  .collection-row .count, .collect-menu .count { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-left: 6px; }
  .collection-row button:not(.collection-open), .collection-banner button, .collection-new button, .collect-menu button {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    font-family: var(--mono); font-size: 11px; padding: 4px 9px; border-radius: 6px; cursor: pointer;
  }
  .collection-row button:hover, .collection-banner button:hover, .collection-banner button.active,
  .collection-new button:hover, .collect-menu button:hover { color: var(--accent); border-color: var(--accent-dim); }
  .collections-empty { color: var(--text-dim); padding: 4px 0 8px; }
  .collection-new { display: flex; gap: 8px; margin-top: 10px; }
  .collection-new input { flex: 1; min-width: 0; }
  .collection-banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .collection-banner .banner-title { flex: 1 1 auto; }
  .collection-banner .banner-views { display: flex; flex-wrap: wrap; gap: 6px; }
  .collect-wrap { position: relative; }
  .collect-menu {
    position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; width: 240px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35); font-size: 13px;
  }
  .collect-menu label { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
  .collect-menu .collection-new { margin-top: 8px; flex-wrap: wrap; }
  .collections-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .collections-head .title {
    flex: 1; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .dock-switch { display: flex; gap: 4px; }
  .collections-panel .dock-switch button, .collections-panel .panel-close { padding: 2px 7px; }
  .dock-switch button.active { color: var(--accent); border-color: var(--accent-dim); }
  .collection-row.current .collection-open { color: var(--accent); font-weight: 600; }
  .collections-panel input[type="text"], .collect-menu input[type="text"], .collections-panel textarea {
    font-size: 13px; padding: 7px 10px;
  }
  .collections-panel textarea {
    width: 100%; box-sizing: border-box; min-height: 60px; resize: vertical;
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; font-family: var(--sans);
  }
  .collections-panel textarea:focus { outline: none; border-color: var(--accent-dim); }
  .collection-item { padding: 4px 0; border-bottom: 1px solid var(--border); }
  .collection-item:last-child { border-bottom: none; }
  .collection-desc {
    color: var(--text-dim); font-size: 12px; margin: -2px 0 4px; white-space: pre-line;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .collection-edit { display: flex; flex-direction: column; gap: 6px; padding: 6px 0; }
  .collection-edit .actions, .collection-confirm .actions { display: flex; gap: 6px; justify-content: flex-end; }
  .collection-confirm { display: flex; flex-direction: column; gap: 6px; padding: 6px 0; font-size: 12.5px; }
  .collections-panel button.danger:hover { color: #e0897a; border-color: #8a4a3f; }
  .inline-error { flex: 1 1 100%; order: 9; color: #e0897a; font-size: 12px; padding-top: 4px; }
  .collection-new.with-description { flex-wrap: wrap; }
  .collection-new.with-description textarea { flex: 1 1 100%; order: 2; min-height: 44px; }
  .collection-banner .banner-note { flex: 1 1 100%; order: 4; color: var(--text-dim); font-size: 12px; }
  .collection-banner .banner-desc {
    flex: 1 1 100%; order: 3; color: var(--text-dim); font-size: 12.5px; white-space: pre-line;
  }
  /* Wider than the results column when the window has room, for a year of
     squares, and still centred on it. --page-width leaves out a docked panel. */
  body { --page-width: 100vw; }
  .timeline {
    --timeline-width: min(1200px, calc(var(--page-width) - 40px));
    position: relative; width: var(--timeline-width); max-width: var(--timeline-width);
    left: min(0px, calc((100% - var(--timeline-width)) / 2));
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 14px;
  }
  .timeline[hidden] { display: none; }
  .timeline-head {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px;
    font-family: var(--mono); font-size: 11px; color: var(--text-dim); min-height: 24px; margin-bottom: 8px;
  }
  .timeline-head button {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    font-family: var(--mono); font-size: 11px; padding: 4px 9px; border-radius: 6px; cursor: pointer;
  }
  .timeline-head button:hover { color: var(--accent); border-color: var(--accent-dim); }
  .timeline-bars {
    display: flex; align-items: stretch; height: 110px; border-bottom: 1px solid var(--border);
    touch-action: none; user-select: none;
  }
  /* The whole column is the target, so short bars are as easy to hit as tall
     ones; the gap between bars is transparent padding on the column. */
  .timeline-bar {
    flex: 1 1 0; min-width: 0; height: 100%; background: transparent; border: none; border-radius: 0;
    padding: 0 1px; display: flex; align-items: flex-end; cursor: pointer;
  }
  .timeline-bar:hover, .timeline-bar.selecting { background: rgba(95, 179, 163, 0.14); }
  .timeline-bar:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
  .timeline-bar .mark {
    display: block; width: 100%; max-width: 32px; margin: 0 auto;
    background: var(--accent); border-radius: 4px 4px 0 0;
  }
  .timeline-axis {
    display: flex; justify-content: space-between; gap: 12px; margin-top: 6px;
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  }
  .timeline-hint { margin-top: 6px; font-size: 12px; color: var(--text-dim); }
  .timeline-actions { display: flex; gap: 6px; }
  .timeline-head button.active { color: var(--accent); border-color: var(--accent-dim); }
  .timeline-scroll { overflow: auto; max-height: 420px; margin: 16px 0; }
  .timeline-squares {
    --square: 14px; display: grid; gap: 2px; width: max-content; user-select: none;
    touch-action: pan-x pan-y; /* a swipe scrolls here; a tap still zooms */
  }
  /* Days fill the panel, up to a limit so a short range doesn't balloon. */
  .timeline-squares.unit-day { --square: 10px; width: 100%; justify-content: start; gap: 3px; }
  .timeline-squares.unit-day .timeline-square { width: 100%; height: auto; aspect-ratio: 1; border-radius: 3px; }
  @media (max-width: 900px) { .timeline-squares.unit-day { gap: 2px; } }
  /* The last day of a month. A clip-path cuts off outlines too, so hovering,
     selecting and keyboard focus brighten these instead. */
  .timeline-squares.unit-day .timeline-square.month-end {
    border-radius: 0; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  }
  /* Grey, not a teal shade, so that an empty day doesn't look like it has documents. */
  .timeline-square.month-end.shade-0, .timeline-square.month-end.shade-0:hover { background: #626a78; }
  .timeline-square.month-end:hover, .timeline-square.month-end.selecting, .timeline-square.month-end:focus-visible {
    filter: brightness(1.7);
  }
  .timeline-square-label {
    font-family: var(--mono); font-size: 10px; line-height: 1; color: var(--text-dim); white-space: nowrap;
  }
  .timeline-square-label.row { padding-right: 6px; align-self: center; }
  .timeline-square-label.col { padding-bottom: 4px; }
  button.timeline-square-label {
    background: none; border: none; border-radius: 0; font-weight: 400; cursor: pointer;
    text-align: left; text-decoration: underline; text-decoration-color: var(--accent-dim); text-underline-offset: 2px;
  }
  button.timeline-square-label:hover { background: none; color: var(--accent); text-decoration-color: var(--accent); }
  button.timeline-square-label:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  .timeline-head .timeline-period { color: var(--text); font-weight: 600; }
  /* Month names sit over several narrow columns; let them run across. */
  .unit-day .timeline-square-label.col { width: 0; }
  .timeline-square {
    display: block; width: var(--square, 10px); height: var(--square, 10px); padding: 0;
    border: none; border-radius: 2px; cursor: pointer; transition: none;
  }
  .timeline-square:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  .timeline-square:hover, .timeline-square.selecting { outline: 1px solid var(--text); outline-offset: 0; }
  /* button:hover would otherwise replace the shade. */
  .timeline-square.shade-0, .timeline-square.shade-0:hover { background: #2a2e36; }
  .timeline-square.shade-1, .timeline-square.shade-1:hover { background: #2a5f56; }
  .timeline-square.shade-2, .timeline-square.shade-2:hover { background: #3d8a7c; }
  .timeline-square.shade-3, .timeline-square.shade-3:hover { background: #5fb3a3; }
  .timeline-square.shade-4, .timeline-square.shade-4:hover { background: #a3e6d8; }
  .timeline-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; }
  .timeline-legend {
    display: flex; align-items: center; gap: 3px; margin-top: 6px;
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
  }
  .timeline-legend .timeline-square { cursor: default; }
  .timeline-legend .timeline-square:first-of-type { margin-left: 3px; }
  .timeline-legend .timeline-square:last-of-type { margin-right: 3px; }
  .select-bar {
    position: sticky; top: 0; z-index: 15; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; margin-bottom: 12px; font-size: 12.5px; color: var(--text-dim);
  }
  .select-bar[hidden] { display: none; }
  .select-bar.has-selection { border-color: var(--accent-dim); }
  .select-bar .select-count { font-family: var(--mono); font-size: 11.5px; margin-right: auto; }
  .select-bar.has-selection .select-count { color: var(--accent); }
  .select-bar button {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    font-family: var(--mono); font-size: 11px; font-weight: 400; padding: 4px 9px; border-radius: 6px; cursor: pointer;
  }
  .select-bar button:hover { color: var(--accent); border-color: var(--accent-dim); background: transparent; }
  .select-bar .select-add { color: var(--accent); border-color: var(--accent-dim); }
  .select-bar .select-message { flex: 1 1 100%; color: var(--text); line-height: 1.5; }
  .select-bar .select-message[hidden] { display: none; }
  .select-bar .select-message button { margin-left: 6px; }
  .select-bar .inline-error { order: 0; }
  .collect-menu .menu-title { color: var(--text-dim); font-size: 12px; padding-bottom: 6px; line-height: 1.4; }
  .collect-menu .bulk-choice { display: flex; width: 100%; justify-content: space-between; margin-bottom: 4px; text-align: left; color: var(--text); font-family: var(--sans); font-size: 13px; }
  .result-heading { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
  .result-select { display: flex; padding: 3px 0; cursor: pointer; flex-shrink: 0; }
  .result-select input { width: 15px; height: 15px; margin: 0; cursor: pointer; accent-color: var(--accent); }
  .result.selected { border-color: var(--accent-dim); }
  /* Left/Right: a full-height sidebar at that edge, with the results column
     centred in the space left over. Narrower windows keep it on top. */
  @media (min-width: 1100px) {
    body.dock-left .collections-panel, body.dock-right .collections-panel {
      position: fixed; top: 0; bottom: 0; width: 280px; margin: 0; z-index: 10;
      overflow-y: auto; border-radius: 0; border-top: none; border-bottom: none; padding: 48px 16px 20px;
    }
    body.dock-left .collections-panel { left: 0; border-left: none; }
    body.dock-right .collections-panel { right: 0; border-right: none; }
    body.dock-left.collections-open { padding-left: 280px; --page-width: calc(100vw - 280px); }
    body.dock-right.collections-open { padding-right: 280px; --page-width: calc(100vw - 280px); }
  }
  @media (max-width: 1099px) {
    .dock-switch .dock-side { display: none; }
  }
</style>
</head>
<body>
  <div class="shell">
    <header>
      <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px;">
        <div>
          <div class="label" id="appLabel"></div>
          <h1 id="appTitle">Frogmouth Search</h1>
          <div class="subtitle" id="appSubtitle"></div>
        </div>
        <div style="text-align:right; padding-top:4px;">
          <div id="whoami" style="font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-bottom:6px;"></div>
          <a href="/help" target="_blank" rel="noopener" class="header-btn" style="text-decoration:none;">Help</a>
          <button type="button" id="collectionsBtn" class="header-btn">Collections</button>
          <button type="button" id="logoutBtn" style="background:transparent; border:1px solid var(--border); color:var(--text-dim); font-size:11px; font-family:var(--mono); padding:5px 10px; border-radius:6px; cursor:pointer;">Sign out</button>
        </div>
      </div>
    </header>

    <div class="collections-panel" id="collectionsPanel" hidden>
      <div class="collections-head">
        <span class="title">Collections</span>
        <div class="dock-switch" id="dockSwitch" title="Where the collections panel sits (left and right need a wider window)">
          <button type="button" class="dock-side" data-dock="left">Left</button>
          <button type="button" data-dock="top">Top</button>
          <button type="button" class="dock-side" data-dock="right">Right</button>
        </div>
        <button type="button" class="panel-close" id="collectionsClose" title="Close">&times;</button>
      </div>
      <div id="collectionsList"></div>
      <form class="collection-new with-description" id="newCollectionForm">
        <input type="text" id="newCollectionName" placeholder="New collection name" maxlength="100" autocomplete="off">
        <button type="submit">Create</button>
        <textarea id="newCollectionDescription" placeholder="Description (optional)" maxlength="1000"></textarea>
      </form>
    </div>

    <form class="search-form" id="searchForm">
      <input type="text" id="queryInput" placeholder="Search…" autocomplete="off" autofocus>
      <button type="submit" id="searchBtn">Search</button>
    </form>

    <div class="logic-toggle" id="scopeToggle" style="margin-bottom:10px;">
      Search in:
      <div class="switch">
        <button type="button" data-scope="" class="active">All</button>
        <!-- one button per configured source, added from /api/config -->
      </div>
    </div>

    <div class="logic-toggle" id="modeToggle" style="margin-bottom:10px; display:none;">
      Mode:
      <div class="switch">
        <button type="button" data-mode="keyword" title="Documents containing the words searched for">Keyword</button>
        <button type="button" data-mode="semantic" title="Documents closest in meaning, whether or not they use the same words">Semantic</button>
        <button type="button" data-mode="hybrid" title="Both, ranked together">Hybrid</button>
      </div>
    </div>

    <button type="button" class="filter-toggle" id="filterToggle">
      &darr; Filters <span class="count" id="filterCount" style="display:none;"></span>
    </button>

    <div class="filters hidden" id="filters">
      <div id="filterRows"></div>
      <div class="filter-controls-row">
        <button type="button" class="add-row-btn" id="addFilterRow">+ Add filter</button>
        <div class="logic-toggle" id="logicToggle" style="display:none;">
          Match:
          <div class="switch">
            <button type="button" id="logicAndBtn" class="active">ALL (AND)</button>
            <button type="button" id="logicOrBtn">ANY (OR)</button>
          </div>
        </div>
      </div>
      <div class="filter-field">
        <label>Date range</label>
        <div class="date-row">
          <input type="date" id="dateFromFilter" title="After">
          <input type="date" id="dateToFilter" title="Before">
        </div>
      </div>
      <button type="button" class="clear-filters" id="clearFilters">Clear all filters</button>
    </div>

    <div class="collection-banner" id="collectionBanner" hidden></div>
    <div class="timeline" id="timeline" hidden></div>

    <div class="meta-row">
      <span id="metaRow"></span>
      <div class="page-size-control">
        <label for="pageSizeSelect">Show</label>
        <select id="pageSizeSelect">
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>
    </div>

    <div class="select-bar" id="selectBar" hidden>
      <span class="select-count" id="selectCount" aria-live="polite"></span>
      <button type="button" id="selectPage">Select page</button>
      <button type="button" id="selectClear">Clear</button>
      <div class="collect-wrap"><button type="button" class="select-add" id="selectAdd">Add selected to collection</button></div>
      <div class="collect-wrap"><button type="button" id="selectAddAll"></button></div>
      <div class="select-message" id="selectMessage" hidden></div>
    </div>

    <div class="results" id="results">
      <div class="empty-state">
        <div class="big">// ready</div>
        Enter a search term above to query the index.
      </div>
    </div>

    <div class="pager" id="pager" style="display:none;">
      <button id="prevBtn">&larr; Previous</button>
      <button id="nextBtn">Next &rarr;</button>
    </div>

    <footer class="app-version" id="appVersion"></footer>
  </div>

<script>
  const form = document.getElementById('searchForm');
  const input = document.getElementById('queryInput');
  const resultsEl = document.getElementById('results');
  const metaRow = document.getElementById('metaRow');
  const pager = document.getElementById('pager');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const searchBtn = document.getElementById('searchBtn');
  const pageSizeSelect = document.getElementById('pageSizeSelect');

  let ROWS_PER_PAGE = parseInt(pageSizeSelect.value, 10) || 10;
  // Reloads the view that's showing at a given offset (Previous/Next, page
  // size): the search, or a collection (set by the collections code below).
  let loadPage = start => runSearch(currentQuery, start);
  let semanticAvailable = false;
  let currentQuery = '';
  let currentStart = 0;
  let currentTotal = 0;
  // True once a search has actually been run (Search pressed, or a filter/date
  // touched). currentQuery alone can't gate this anymore -- a blank query is now
  // valid once filters are doing the work, so `if (currentQuery)` would wrongly
  // skip re-running a filter-only browse. Stays false on page load so nothing
  // runs before the user does something.
  let hasSearched = false;

  async function apiFetch(url, opts) {
    const res = await fetch(url, opts);
    if (res.status === 401) {
      window.location.href = '/';
      throw new Error('Session expired');
    }
    return res;
  }

  (async () => {
    try {
      const res = await apiFetch('/api/whoami');
      const data = await res.json();
      document.getElementById('whoami').textContent = data.displayName || data.username;
      if (data.version) document.getElementById('appVersion').textContent = `Frogmouth v${data.version}`;
    } catch (err) { /* redirect already in flight */ }
  })();

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/';
  });

  const filterToggle = document.getElementById('filterToggle');
  const filterCount = document.getElementById('filterCount');
  const filtersPanel = document.getElementById('filters');
  const filterRowsEl = document.getElementById('filterRows');
  const addFilterRowBtn = document.getElementById('addFilterRow');
  const logicToggle = document.getElementById('logicToggle');
  const logicAndBtn = document.getElementById('logicAndBtn');
  const logicOrBtn = document.getElementById('logicOrBtn');
  const dateFromFilter = document.getElementById('dateFromFilter');
  const dateToFilter = document.getElementById('dateToFilter');
  const clearFiltersBtn = document.getElementById('clearFilters');

  // Everything below that depends on the index layout -- filter list, source
  // scopes, type groups -- is filled in from /api/config (config.yaml) by
  // applyConfig() before anything else runs.
  let CONFIG = { app: {}, sources: [], filters: [], types: { groups: [], aliases: {} } };
  let FIELD_LABELS = {};        // filter key -> label
  let FILTER_PLACEHOLDERS = {}; // filter key -> placeholder for free-text filters
  let SOURCES_BY_HOST = {};     // doc.source value -> source config
  let typeOptions = [];     // populated from /api/facets
  let shareOptions = [];    // populated from /api/facets
  let filterRows = [];      // [{ id, field, value, not }]
  let filterLogic = 'AND';
  let rowIdCounter = 0;

  // Source scope: '' = everything, otherwise a configured source's key. Used
  // here to hide Source dropdown options that don't belong to the selected
  // scope; the server applies the same scope to the query itself.
  let SCOPE_HOSTS = {}; // source key -> doc.source value
  const scopeToggle = document.getElementById('scopeToggle');
  const scopeSwitch = scopeToggle.querySelector('.switch');
  let searchScope = '';
  scopeSwitch.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-scope]');
    if (!btn) return;
    searchScope = btn.dataset.scope;
    scopeSwitch.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    // A Source value picked under the old scope may not exist in the new one
    // (e.g. a file share selected, then switching to Mail) -- clear it rather
    // than silently keep filtering on a source the dropdown no longer shows.
    // Re-render regardless of whether anything was cleared: any already-open
    // Source dropdown's option list also needs to reflect the new scope.
    const wantedHost = SCOPE_HOSTS[searchScope];
    filterRows.forEach(row => {
      if (row.field !== 'share' || !row.value) return;
      const stillValid = shareOptions.some(o => o.value === row.value && (!wantedHost || o.source === wantedHost));
      if (!stillValid) row.value = '';
    });
    renderFilterRows();
    updateFilterCount();
    loadFacets();
    if (hasSearched) runSearch(currentQuery, 0);
  });

  // Search mode: keyword unless the server offers vector search (cfg.search_modes).
  const modeToggle = document.getElementById('modeToggle');
  const modeSwitch = modeToggle.querySelector('.switch');
  let searchMode = 'keyword';
  function setSearchMode(mode) {
    searchMode = mode;
    modeSwitch.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  }
  modeSwitch.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode]');
    if (!btn || btn.dataset.mode === searchMode) return;
    setSearchMode(btn.dataset.mode);
    if (hasSearched) runSearch(currentQuery, 0);
  });

  function activeFilterCount() {
    const rowCount = filterRows.filter(r => r.value.trim()).length;
    const dateCount = [dateFromFilter.value, dateToFilter.value].filter(Boolean).length;
    return rowCount + dateCount;
  }

  // Tracks the Source-filter count across calls so the AND->OR nudge below
  // only fires on the transition into "2 or more", not every time this runs
  // while already there -- see updateFilterCount.
  let prevShareFilterCount = 0;

  function updateFilterCount() {
    const n = activeFilterCount();
    if (n > 0) {
      filterCount.style.display = 'inline-block';
      filterCount.textContent = n;
    } else {
      filterCount.style.display = 'none';
    }
    // ALL/ANY only combines "is" rows; "is not" rows always apply.
    logicToggle.style.display = filterRows.filter(r => !r.not).length > 1 ? 'flex' : 'none';

    // Two (or more) different Source filters can never both match the same
    // document under AND logic -- a file/mailbox/site only ever has one
    // `share` value, so that combination always returns zero results.
    // Nudge to OR the moment a second Source filter appears, but only on
    // that transition (crossing from fewer than 2 up to 2+) -- if the user
    // deliberately switches back to AND afterward, this won't immediately
    // override them again just because a later, unrelated filter changes.
    const shareCount = filterRows.filter(r => r.field === 'share' && !r.not && r.value.trim()).length;
    if (prevShareFilterCount < 2 && shareCount >= 2 && filterLogic === 'AND') {
      filterLogic = 'OR';
      logicOrBtn.classList.add('active');
      logicAndBtn.classList.remove('active');
    }
    prevShareFilterCount = shareCount;
  }

  function byValueAlpha(a, b) {
    return a.value.localeCompare(b.value, undefined, { sensitivity: 'base' });
  }

  // Display-only override for a dropdown option's text -- the underlying
  // value (what's actually sent as the filter) stays e.g. "jpg"; only the
  // label changes. Built from types.aliases ("jpg/jpeg") and the group
  // labels in config.yaml.
  let VALUE_LABELS = {};
  // Fixed order for the broader categories (types.groups) -- shown above
  // the individual types rather than sorted in among them.
  let TYPE_GROUP_ORDER = [];
  const DROPDOWN_FIELDS = {
    type: {
      options: () => {
        const groups = TYPE_GROUP_ORDER.map(key => typeOptions.find(o => o.value === key)).filter(Boolean);
        const individual = typeOptions.filter(o => !TYPE_GROUP_ORDER.includes(o.value)).sort(byValueAlpha);
        return [...groups, ...individual];
      },
      placeholder: 'Choose a type…',
    },
    share: {
      // Only shares that belong to the currently selected source scope --
      // picking "Mail" shouldn't still offer file share names to filter by.
      options: () => {
        const wantedHost = SCOPE_HOSTS[searchScope];
        const inScope = wantedHost ? shareOptions.filter(o => o.source === wantedHost) : shareOptions;
        return inScope.slice().sort(byValueAlpha);
      },
      placeholder: 'Choose a source…',
    },
  };

  function buildValueInput(row) {
    const dropdown = DROPDOWN_FIELDS[row.field];
    if (dropdown) {
      const select = document.createElement('select');
      select.className = 'filter-value';
      select.innerHTML = `<option value="">${escapeHtml(dropdown.placeholder)}</option>` +
        dropdown.options().map(({ value, count }) =>
          `<option value="${escapeHtml(value)}" ${row.value === value ? 'selected' : ''}>${escapeHtml(VALUE_LABELS[value] || value)} (${count})</option>`
        ).join('');
      select.addEventListener('change', () => {
        row.value = select.value;
        updateFilterCount();
        loadFacets();
        if (hasSearched) runSearch(currentQuery, 0);
      });
      return select;
    }
    const input = document.createElement('input');
    input.className = 'filter-value';
    input.type = 'text';
    input.placeholder = FILTER_PLACEHOLDERS[row.field] || '';
    input.value = row.value;
    let debounceTimer;
    input.addEventListener('input', () => {
      row.value = input.value;
      updateFilterCount();
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        loadFacets();
        if (hasSearched) runSearch(currentQuery, 0);
      }, 400);
    });
    return input;
  }

  function renderFilterRows() {
    filterRowsEl.innerHTML = '';
    filterRows.forEach(row => {
      const rowEl = document.createElement('div');
      rowEl.className = 'filter-row';

      const fieldSelect = document.createElement('select');
      fieldSelect.className = 'field-select';
      fieldSelect.innerHTML = Object.entries(FIELD_LABELS)
        .map(([val, label]) => `<option value="${val}" ${row.field === val ? 'selected' : ''}>${label}</option>`)
        .join('');
      fieldSelect.addEventListener('change', () => {
        row.field = fieldSelect.value;
        renderFilterRows();
        updateFilterCount();
        loadFacets();
        if (hasSearched) runSearch(currentQuery, 0);
      });

      const notSelect = document.createElement('select');
      notSelect.className = 'not-select';
      notSelect.title = '"is not" rows always apply, whether matching ALL or ANY';
      notSelect.innerHTML = `<option value="">is</option><option value="not" ${row.not ? 'selected' : ''}>is not</option>`;
      notSelect.addEventListener('change', () => {
        row.not = notSelect.value === 'not';
        updateFilterCount();
        loadFacets();
        if (hasSearched) runSearch(currentQuery, 0);
      });

      const valueWrap = document.createElement('div');
      valueWrap.className = 'filter-value-wrap';
      valueWrap.appendChild(buildValueInput(row));

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'remove-row';
      removeBtn.textContent = '×';
      removeBtn.addEventListener('click', () => {
        filterRows = filterRows.filter(r => r.id !== row.id);
        renderFilterRows();
        updateFilterCount();
        loadFacets();
        if (hasSearched) runSearch(currentQuery, 0);
      });

      rowEl.appendChild(fieldSelect);
      rowEl.appendChild(notSelect);
      rowEl.appendChild(valueWrap);
      rowEl.appendChild(removeBtn);
      filterRowsEl.appendChild(rowEl);
    });
  }

  addFilterRowBtn.addEventListener('click', () => {
    const firstField = Object.keys(FIELD_LABELS)[0];
    if (!firstField) return;
    filterRows.push({ id: ++rowIdCounter, field: firstField, value: '', not: false });
    renderFilterRows();
    updateFilterCount();
  });

  filterToggle.addEventListener('click', () => {
    filtersPanel.classList.toggle('hidden');
  });

  logicAndBtn.addEventListener('click', () => {
    filterLogic = 'AND';
    logicAndBtn.classList.add('active');
    logicOrBtn.classList.remove('active');
    loadFacets();
    if (hasSearched) runSearch(currentQuery, 0);
  });

  logicOrBtn.addEventListener('click', () => {
    filterLogic = 'OR';
    logicOrBtn.classList.add('active');
    logicAndBtn.classList.remove('active');
    loadFacets();
    if (hasSearched) runSearch(currentQuery, 0);
  });

  clearFiltersBtn.addEventListener('click', () => {
    filterRows = [];
    filterLogic = 'AND';
    logicAndBtn.classList.add('active');
    logicOrBtn.classList.remove('active');
    dateFromFilter.value = '';
    dateToFilter.value = '';
    renderFilterRows();
    updateFilterCount();
    loadFacets();
    if (hasSearched) runSearch(currentQuery, 0);
  });

  [dateFromFilter, dateToFilter].forEach(el => {
    el.addEventListener('change', () => {
      updateFilterCount();
      loadFacets();
      if (hasSearched) runSearch(currentQuery, 0);
    });
  });

  // Populate the file-type dropdown from whatever mimetypes actually exist
  // in the index right now, rather than a hardcoded guess -- and, since this
  // is called again on every filter/scope/date change (see currentFilterParams),
  // Type's counts narrow to match whatever else is currently selected (the
  // server excludes the Type filter's own value when computing them, so
  // picking a type doesn't shrink the very list it was chosen from).
  async function loadFacets() {
    try {
      const res = await apiFetch(`/api/facets?${currentFilterParams().toString()}`);
      const data = await res.json();
      typeOptions = data.types || [];
      shareOptions = data.shares || [];
      // Refresh any already-rendered Type/Source dropdown with the new counts
      // (and, for Source, any scope-based option filtering) without losing
      // the current selection -- renderFilterRows rebuilds from filterRows,
      // which still holds each row's existing value. Skipped while a
      // free-text filter (from/to/attachments) is focused: this fires after
      // every debounced keystroke, and rebuilding the row would steal focus
      // mid-edit. The fresh counts still apply next time anything else
      // re-renders the rows.
      const active = document.activeElement;
      const isTypingFreeText = active && active.tagName === 'INPUT' && active.classList.contains('filter-value');
      if (!isTypingFreeText) renderFilterRows();
    } catch (err) {
      console.warn('Could not load type/share filters:', err);
    }
  }

  function applyConfig(cfg) {
    CONFIG = cfg;
    const app = cfg.app || {};
    if (app.title) {
      document.title = app.title;
      document.getElementById('appTitle').textContent = app.title;
    }
    document.getElementById('appLabel').textContent = app.label || '';
    document.getElementById('appSubtitle').textContent = app.subtitle || '';
    if (app.search_placeholder) input.placeholder = app.search_placeholder;

    SCOPE_HOSTS = {};
    SOURCES_BY_HOST = {};
    (cfg.sources || []).forEach(src => {
      SCOPE_HOSTS[src.key] = src.host;
      SOURCES_BY_HOST[src.host] = src;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.scope = src.key;
      btn.textContent = src.label || src.key;
      scopeSwitch.appendChild(btn);
    });
    // A single source has nothing to scope between.
    scopeToggle.style.display = (cfg.sources || []).length > 1 ? '' : 'none';

    const modes = cfg.search_modes || ['keyword'];
    modeSwitch.querySelectorAll('button').forEach(b => { b.style.display = modes.includes(b.dataset.mode) ? '' : 'none'; });
    modeToggle.style.display = modes.length > 1 ? '' : 'none';
    setSearchMode(cfg.default_mode || 'keyword');
    semanticAvailable = modes.includes('semantic');

    FIELD_LABELS = {};
    FILTER_PLACEHOLDERS = {};
    (cfg.filters || []).forEach(f => {
      FIELD_LABELS[f.key] = f.label || f.key;
      if (f.placeholder) FILTER_PLACEHOLDERS[f.key] = f.placeholder;
    });

    const types = cfg.types || {};
    VALUE_LABELS = {};
    Object.entries(types.aliases || {}).forEach(([key, values]) => { VALUE_LABELS[key] = values.join('/'); });
    TYPE_GROUP_ORDER = (types.groups || []).map(g => g.key);
    (types.groups || []).forEach(g => { VALUE_LABELS[g.key] = g.label || g.key; });
  }

  (async () => {
    try {
      const res = await apiFetch('/api/config');
      applyConfig(await res.json());
    } catch (err) {
      console.warn('Could not load UI config:', err);
    }
    loadFacets();
  })();

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function firstOf(val) {
    return Array.isArray(val) ? val[0] : val;
  }

  function allOf(val) {
    if (val === undefined || val === null) return [];
    return Array.isArray(val) ? val : [val];
  }

  // Extracted text (especially from PDFs, .eml, and Word docs) very
  // often has long runs of blank/whitespace-only lines from page layout,
  // email header blocks, etc. This is purely cosmetic for the expanded
  // view — what's indexed is unaffected. 3+ consecutive blank lines
  // collapse to a single blank line; whitespace-only lines count as blank.
  function collapseBlankLines(text) {
    return text.replace(/(?:[ \t]*\r?\n){3,}/g, '\n\n');
  }

  // Highlights every whole occurrence of each query term in the full
  // body text, so the expanded view gets the same visual cue as the
  // short server-generated snippet, without a second request.
  // The expanded view's text, fetched on first expand rather than sent with
  // every result. Resolves false if it couldn't be loaded.
  async function loadFullText(id, el) {
    try {
      const res = await apiFetch(`/api/document?id=${encodeURIComponent(id)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      if (!data.content) {
        el.innerHTML = '<em>No content available for this document.</em>';
        return true;
      }
      el.innerHTML = highlightBody(data.content, currentQuery);
      if (data.length > data.content.length) {
        const note = document.createElement('p');
        note.innerHTML = `<em>Showing the first ${data.content.length.toLocaleString()} of ${data.length.toLocaleString()} characters. The rest is in the original file.</em>`;
        el.appendChild(note);
      }
      return true;
    } catch (err) {
      el.innerHTML = `<em>Couldn't load this document's text: ${escapeHtml(err.message)}</em>`;
      return false;
    }
  }

  function highlightBody(text, query) {
    const escaped = escapeHtml(collapseBlankLines(text));
    const terms = (query || '')
      .split(/\s+/)
      .map(t => t.trim())
      .filter(Boolean)
      .map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
      .sort((a, b) => b.length - a.length); // longest first avoids partial-nesting
    if (!terms.length) return escaped;
    const re = new RegExp(`(${terms.join('|')})`, 'gi');
    return escaped.replace(re, '<mark>$1</mark>');
  }

  function fmtDate(val) {
    if (!val) return null;
    const d = new Date(firstOf(val));
    if (isNaN(d)) return null;
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }

  // Full date + time, in the viewer's own locale/timezone -- used in the
  // expanded detail view's Created/Modified rows, as opposed to fmtDate's
  // shorter date-only form used in the compact result-row summary line.
  function fmtDateTime(val) {
    if (!val) return null;
    const d = new Date(firstOf(val));
    if (isNaN(d)) return null;
    return d.toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
    });
  }

  // What a document's main date is: an email's sent date, a photo's capture
  // date, or otherwise its file's modified time (which it then equals).
  function dateSource(doc, isMail) {
    if (isMail || firstOf(doc.email_from) || firstOf(doc.email_subject)) return 'Sent';
    const modified = new Date(firstOf(doc.modified)).getTime();
    return new Date(firstOf(doc.created)).getTime() === modified ? 'Modified' : 'Taken';
  }

  // emptyHtml: what to show instead of the usual "nothing found" message.
  function renderResults(data, emptyHtml) {
    resultsEl.innerHTML = '';

    if ((!data.docs || data.docs.length === 0) && emptyHtml) {
      resultsEl.innerHTML = emptyHtml;
      pager.style.display = 'none';
      updateSelectBar();
      return;
    }
    if (!data.docs || data.docs.length === 0) {
      const emptyMsg = currentQuery
        ? `Nothing found for "${escapeHtml(currentQuery)}". Try a different term.`
        : 'Nothing matches the selected filters. Try broadening them.';
      resultsEl.innerHTML = `
        <div class="empty-state">
          <div class="big">// no matches</div>
          ${emptyMsg}
        </div>`;
      pager.style.display = 'none';
      updateSelectBar();
      return;
    }

    data.docs.forEach(doc => {
      // Per-source behavior comes from sources[] in config.yaml, matched on
      // doc.source. An unknown source falls back to a plain download.
      const src = SOURCES_BY_HOST[firstOf(doc.source)] || {};
      // layout: email -- the indexed title is the subject plus a synthetic
      // ".eml", so the real subject is shown instead.
      const isMail = src.layout === 'email';
      // open: link -- doc.id is the item's own web URL (only usable if it's an
      // https URL -- guards against a malformed/unexpected value). The folder
      // link is derived by dropping the last path segment (the filename).
      const openLink = src.open === 'link' && /^https:\/\//i.test(doc.id) ? doc.id : null;
      const folderLink = openLink && src.folder_link ? openLink.replace(/\/[^/]*$/, '') : null;
      // A standalone image has one camera/location (scalar fields); an email
      // can carry several photo attachments, each with its own (list-valued
      // fields, aligned by index within each family -- see
      // Pelican's extract_text._aggregate_image_attachments). allOf() treats a scalar
      // as a one-item list, so the same code covers both cases.
      const cameraMakes = allOf(doc.image_camera_make);
      const cameraModels = allOf(doc.image_camera_model);
      const camera = Array.from({ length: Math.max(cameraMakes.length, cameraModels.length) },
        (_, i) => [cameraMakes[i], cameraModels[i]].filter(Boolean).join(' ')
      ).filter(Boolean).join(', ');
      const gpsLats = allOf(doc.image_gps_lat);
      const gpsLons = allOf(doc.image_gps_lon);
      const locations = allOf(doc.image_location);
      const locationValue = locations.map((loc, i) => {
        const lat = gpsLats[i], lon = gpsLons[i];
        const coord = (lat !== undefined && lon !== undefined) ? `${Number(lat).toFixed(4)}, ${Number(lon).toFixed(4)}` : null;
        return loc && coord ? `${loc} (${coord})` : (loc || coord);
      }).filter(Boolean).join('; ');
      const title = (isMail && firstOf(doc.email_subject)) || firstOf(doc.title) || firstOf(doc.email_subject) || firstOf(doc.filename) || doc.id.split('/').pop() || 'Untitled';
      const mimetype = firstOf(doc.type);
      const created = fmtDate(doc.created);
      const sender = firstOf(doc.email_from);
      const share = firstOf(doc.share);

      const hl = (data.highlighting && data.highlighting[doc.id] && data.highlighting[doc.id].content)
        ? data.highlighting[doc.id].content.join(' … ')
        : escapeHtml((firstOf(doc.content) || '').slice(0, 240));

      const metaParts = [];
      if (share) metaParts.push(`<span>${escapeHtml(share)}</span>`);
      if (sender) metaParts.push(`<span>${escapeHtml(sender)}</span>`);
      if (mimetype) metaParts.push(`<span>${escapeHtml(mimetype)}</span>`);
      if (created) metaParts.push(`<span>${collectionView === 'timeline' ? `${dateSource(doc, isMail)}: ` : ''}${created}</span>`);
      if (allOf(doc.email_attachments).length) metaParts.push(`<span title="Has attachments">&#128206; ${allOf(doc.email_attachments).length}</span>`);

      // Build the full-detail fields shown once expanded. Anything not
      // present on this doc is simply skipped rather than shown blank.
      // Full date+time here (unlike the compact summary line above, which
      // keeps the shorter date-only fmtDate for created).
      const createdFull = fmtDateTime(doc.created);
      const modifiedFull = fmtDateTime(doc.modified);
      const sizeBytes = firstOf(doc.size);
      const sizeStr = sizeBytes ? `${(sizeBytes / 1024).toFixed(1)} KB` : null;
      const subject = firstOf(doc.email_subject);
      const toList = allOf(doc.email_to).join(', ');
      const ccList = allOf(doc.email_cc).join(', ');
      const attachmentsList = allOf(doc.email_attachments).join('\n');
      const messageId = firstOf(doc.email_message_id);

      const detailFields = [
        // Title and Subject are the same value for mail (the indexed title is
        // just the subject plus a synthetic ".eml") -- only show one.
        [isMail ? null : 'Title', title],
        [src.share_label || 'Source', share],
        ['Subject', subject],
        ['From', sender],
        ['To', toList],
        ['CC', ccList],
        ['Attachments', attachmentsList],
        ['Message-ID', isMail ? messageId : null],
        ['Camera', camera],
        ['Location', locationValue],
        ['Type', mimetype],
        ['Size', sizeStr],
        ['Created', createdFull],
        // Mail has no independent "modified" separate from when it was received.
        [isMail ? null : 'Modified', modifiedFull],
        // A mail web link isn't a meaningful "path" -- the open-link button covers it.
        ['Path', isMail ? null : doc.id]
      ].filter(([label, v]) => label && v);

      const detailGridHtml = detailFields.map(([label, value]) => `
        <div class="detail-label">${escapeHtml(label)}</div>
        <div class="detail-value">${escapeHtml(String(value))}</div>
      `).join('');

      // Built up rather than a single ternary: link sources with folder_link
      // get two buttons side by side (open the item itself, or its containing
      // folder), where other results only ever get one.
      let actionButtonsHtml;
      if (src.open === 'link') {
        const linkLabel = src.link_label || 'Open';
        const buttons = [];
        if (openLink) {
          buttons.push(`<a class="download-btn" href="${escapeHtml(openLink)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(linkLabel)}">&#8599; ${escapeHtml(linkLabel)}</a>`);
        }
        if (folderLink) {
          buttons.push(`<a class="download-btn" href="${escapeHtml(folderLink)}" target="_blank" rel="noopener noreferrer" title="Open this item's folder">&#128193; Open folder</a>`);
        }
        actionButtonsHtml = buttons.join('');
      } else {
        actionButtonsHtml = `<a class="download-btn" href="/api/download?id=${encodeURIComponent(doc.id)}" title="Download original file">
              &#8595; Download
            </a>`;
      }

      const div = document.createElement('div');
      div.className = 'result';
      div.innerHTML = `
        <div class="result-header">
          <div class="result-heading">
            <label class="result-select" title="Select this result (Shift-click to select a run of them)"><input type="checkbox" class="result-check" aria-label="Select ${escapeHtml(title)}"></label>
            <div class="result-title">${escapeHtml(title)}</div>
          </div>
          <div class="result-actions">
            ${actionButtonsHtml}
            <div class="collect-wrap">
              <button type="button" class="download-btn collect-btn" title="Add to or remove from your collections">+ Collection</button>
            </div>
            <button type="button" class="expand-btn">
              <span class="expand-label">Expand</span><span class="expand-caret">&#9656;</span>
            </button>
          </div>
        </div>
        ${metaParts.length ? `<div class="result-meta">${metaParts.join('')}</div>` : ''}
        <div class="result-snippet">${hl || '<em>No preview available</em>'}</div>
        <div class="result-detail" style="display:none;">
          <div class="detail-grid">${detailGridHtml}</div>
          <div class="detail-body-label">Full content</div>
          <div class="detail-body"><em>Loading…</em></div>
        </div>
      `;

      const check = div.querySelector('.result-check');
      check.dataset.id = doc.id;
      check.checked = selectedDocs.has(doc.id);
      div.classList.toggle('selected', check.checked);

      div.querySelector('.collect-btn').addEventListener('click', e => {
        e.stopPropagation();
        const wrap = e.currentTarget.parentElement;
        if (wrap.querySelector('.collect-menu')) closeCollectMenus();
        else openCollectMenu(wrap, doc.id);
      });

      const expandBtn = div.querySelector('.expand-btn');
      const expandLabel = div.querySelector('.expand-label');
      let textRequested = false;
      expandBtn.addEventListener('click', async () => {
        const isOpen = div.classList.toggle('open');
        div.querySelector('.result-detail').style.display = isOpen ? 'block' : 'none';
        expandLabel.textContent = isOpen ? 'Collapse' : 'Expand';
        if (isOpen && !textRequested) {
          textRequested = true;
          // Allow another try on the next expand if this one fails.
          textRequested = await loadFullText(doc.id, div.querySelector('.detail-body'));
        }
      });

      resultsEl.appendChild(div);
    });

    lastChecked = null;
    updateSelectBar();
    pager.style.display = data.numFound > ROWS_PER_PAGE ? 'flex' : 'none';
    prevBtn.disabled = currentStart === 0;
    nextBtn.disabled = currentStart + ROWS_PER_PAGE >= data.numFound;
  }

  // Shared by runSearch and loadFacets, so the Type dropdown's counts are
  // always computed against exactly the same filter/scope/date state a
  // search would actually use.
  function currentFilterParams() {
    const params = new URLSearchParams();
    const activeRows = filterRows.filter(r => r.value.trim());
    if (activeRows.length) {
      params.set('filters', JSON.stringify(activeRows.map(r => ({ field: r.field, value: r.value.trim(), ...(r.not && { not: true }) }))));
      params.set('logic', filterLogic);
    }
    if (searchScope) params.set('scope', searchScope);
    if (dateFromFilter.value) params.set('dateFrom', dateFromFilter.value);
    if (dateToFilter.value) params.set('dateTo', dateToFilter.value);
    return params;
  }

  async function runSearch(q, start = 0) {
    leaveCollectionView();
    selectMessage.hidden = true;
    currentQuery = q;
    currentStart = start;
    hasSearched = true;
    searchBtn.disabled = true;
    metaRow.textContent = 'Searching…';

    try {
      const searchParams = currentFilterParams();
      searchParams.set('q', q);
      searchParams.set('start', String(start));
      searchParams.set('rows', String(ROWS_PER_PAGE));
      if (searchMode !== 'keyword') searchParams.set('mode', searchMode);

      const res = await apiFetch(`/api/search?${searchParams.toString()}`);
      const data = await res.json();

      if (data.error) {
        metaRow.innerHTML = `<span class="status-dot err"></span>Search failed: ${escapeHtml(data.error)}`;
        resultsEl.innerHTML = `<div class="empty-state"><div class="big">// error</div>Could not reach the search index. Check that OpenSearch is running.</div>`;
        pager.style.display = 'none';
        return;
      }

      currentTotal = data.numFound;
      const rangeEnd = Math.min(start + ROWS_PER_PAGE, data.numFound);
      metaRow.innerHTML = data.numFound > 0
        ? `<span class="status-dot ok"></span>${data.numFound.toLocaleString()} result${data.numFound === 1 ? '' : 's'} — showing ${start + 1}–${rangeEnd}`
        : `<span class="status-dot ok"></span>0 results`;
      if (data.partial) {
        metaRow.innerHTML += ' — <span class="status-dot err"></span>some results could not be loaded';
      }

      renderResults(data);
    } catch (err) {
      metaRow.innerHTML = `<span class="status-dot err"></span>Connection error`;
      resultsEl.innerHTML = `<div class="empty-state"><div class="big">// error</div>Could not reach the search service.</div>`;
      pager.style.display = 'none';
    } finally {
      searchBtn.disabled = false;
    }
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    // A blank query is valid: with filters set this browses just what matches
    // them, and with none set it lists everything the signed-in user can see --
    // leave Search blank and let the filters do the work.
    runSearch(input.value.trim(), 0);
  });

  prevBtn.addEventListener('click', () => {
    if (currentStart > 0) loadPage(Math.max(0, currentStart - ROWS_PER_PAGE));
  });

  nextBtn.addEventListener('click', () => {
    if (currentStart + ROWS_PER_PAGE < currentTotal) loadPage(currentStart + ROWS_PER_PAGE);
  });

  pageSizeSelect.addEventListener('change', () => {
    ROWS_PER_PAGE = parseInt(pageSizeSelect.value, 10) || 10;
    // Changing page size while sitting mid-list would produce a
    // confusing start offset, so jump back to the first page.
    if (hasSearched || openCollection) loadPage(0);
  });

  // ------------------------------------------------------------------
  // Collections: the user's private lists of results (/api/collections),
  // shown in the results list, and "more like these" searches from them.
  // ------------------------------------------------------------------
  const collectionsBtn = document.getElementById('collectionsBtn');
  const collectionsPanel = document.getElementById('collectionsPanel');
  const collectionsList = document.getElementById('collectionsList');
  const newCollectionForm = document.getElementById('newCollectionForm');
  const newCollectionName = document.getElementById('newCollectionName');
  const newCollectionDescription = document.getElementById('newCollectionDescription');
  const collectionBanner = document.getElementById('collectionBanner');
  let openCollection = null;    // { id, name } while a collection or its "more like these" is showing
  let collectionView = null;    // 'items', 'timeline', 'semantic' or 'keyword'
  const timelineEl = document.getElementById('timeline');
  let timelineRange = null;     // { from, to } while zoomed in on part of the timeline
  let timelineHistory = [];     // the ranges zoomed in from, for going back; null is all dates
  let timelineData = null;      // the latest response, to redraw when switching chart
  const TIMELINE_SHAPE_KEY = 'frogmouth.timelineShape';
  let timelineShape = loadPref(TIMELINE_SHAPE_KEY) === 'bars' ? 'bars' : 'squares';

  async function collectionsApi(method, url, body) {
    const res = await apiFetch(url, {
      method,
      ...(body && { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  // An error shown where it happened (a form, row or menu) rather than in a
  // browser pop-up; replaces any earlier one there.
  function showInlineError(where, message) {
    let el = where.querySelector(':scope > .inline-error');
    if (!el) {
      el = document.createElement('div');
      el.className = 'inline-error';
      el.setAttribute('role', 'alert');
      where.appendChild(el);
    }
    el.textContent = message;
  }
  function clearInlineError(where) {
    const el = where.querySelector(':scope > .inline-error');
    if (el) el.remove();
  }

  async function refreshCollectionsPanel() {
    let collections;
    try {
      ({ collections } = await collectionsApi('GET', '/api/collections'));
    } catch (err) {
      collectionsList.innerHTML = `<div class="collections-empty">Couldn't load your collections: ${escapeHtml(err.message)}</div>`;
      return;
    }
    collectionsList.innerHTML = collections.length ? ''
      : '<div class="collections-empty">No collections yet. Use "+ Collection" on a result, or create one here.</div>';
    for (const c of collections) {
      const item = document.createElement('div');
      item.className = 'collection-item';
      const row = document.createElement('div');
      row.className = 'collection-row' + (openCollection && openCollection.id === c.id ? ' current' : '');
      row.innerHTML = `<button type="button" class="collection-open">${escapeHtml(c.name)}<span class="count">${c.count}</span></button>
        <button type="button" class="collection-edit-btn">Edit</button>
        <button type="button" class="collection-delete">Delete</button>`;
      item.appendChild(row);
      if (c.description) {
        const desc = document.createElement('div');
        desc.className = 'collection-desc';
        desc.textContent = c.description;
        desc.title = c.description;
        item.appendChild(desc);
      }
      row.querySelector('.collection-open').addEventListener('click', () => {
        // On top it's in the way of the results; docked at the side it stays.
        if (dock === 'top') toggleCollectionsPanel(false);
        showCollection({ id: c.id, name: c.name, description: c.description }, 0);
      });
      row.querySelector('.collection-edit-btn').addEventListener('click', () => {
        const form = document.createElement('form');
        form.className = 'collection-edit';
        form.innerHTML = `<input type="text" maxlength="100" autocomplete="off">
          <textarea maxlength="1000" placeholder="Description (optional)"></textarea>
          <div class="actions"><button type="button" class="cancel">Cancel</button><button type="submit">Save</button></div>`;
        const [nameIn, descIn] = [form.querySelector('input'), form.querySelector('textarea')];
        nameIn.value = c.name;
        descIn.value = c.description || '';
        form.querySelector('.cancel').addEventListener('click', () => refreshCollectionsPanel());
        form.addEventListener('submit', async e => {
          e.preventDefault();
          try {
            const saved = await collectionsApi('PATCH', `/api/collections/${c.id}`, { name: nameIn.value, description: descIn.value });
            if (openCollection && openCollection.id === c.id) {
              Object.assign(openCollection, { name: saved.name, description: saved.description });
              renderBanner();
            }
            refreshCollectionsPanel();
          } catch (err) { showInlineError(form, err.message); }
        });
        item.replaceChildren(form);
        nameIn.focus();
      });
      row.querySelector('.collection-delete').addEventListener('click', () => {
        const box = document.createElement('div');
        box.className = 'collection-confirm';
        box.innerHTML = `<div>Delete <strong>${escapeHtml(c.name)}</strong>? The documents themselves aren't affected.</div>
          <div class="actions"><button type="button" class="cancel">Cancel</button><button type="button" class="danger">Delete</button></div>`;
        // Cancel, Escape, or a click anywhere else puts the row back.
        const restore = () => {
          document.removeEventListener('mousedown', away, true);
          refreshCollectionsPanel();
        };
        const away = e => {
          if (!item.isConnected) document.removeEventListener('mousedown', away, true);
          else if (!item.contains(e.target)) restore();
        };
        document.addEventListener('mousedown', away, true);
        box.addEventListener('keydown', e => { if (e.key === 'Escape') restore(); });
        box.querySelector('.cancel').addEventListener('click', restore);
        box.querySelector('.danger').addEventListener('click', async () => {
          try {
            await collectionsApi('DELETE', `/api/collections/${c.id}`);
            document.removeEventListener('mousedown', away, true);
            if (openCollection && openCollection.id === c.id) backToSearch();
            refreshCollectionsPanel();
          } catch (err) { showInlineError(box, err.message); }
        });
        item.replaceChildren(box);
        box.querySelector('.cancel').focus();
      });
      collectionsList.appendChild(item);
    }
  }

  // Where the panel sits and whether it's open: this browser's preference,
  // remembered between visits. Storage can be unavailable (private windows,
  // blocked site data), in which case the defaults apply each time.
  const DOCK_KEY = 'frogmouth.collectionsDock';
  const OPEN_KEY = 'frogmouth.collectionsOpen';
  function loadPref(key) { try { return localStorage.getItem(key); } catch { return null; } }
  function savePref(key, value) { try { localStorage.setItem(key, value); } catch { /* not remembered */ } }

  let dock = 'right';
  function setDock(side) {
    dock = ['left', 'top', 'right'].includes(side) ? side : 'right';
    document.body.classList.remove('dock-left', 'dock-top', 'dock-right');
    document.body.classList.add(`dock-${dock}`);
    document.querySelectorAll('#dockSwitch [data-dock]').forEach(b => b.classList.toggle('active', b.dataset.dock === dock));
    savePref(DOCK_KEY, dock);
  }
  document.getElementById('dockSwitch').addEventListener('click', e => {
    const b = e.target.closest('[data-dock]');
    if (b) setDock(b.dataset.dock);
  });

  function toggleCollectionsPanel(open) {
    collectionsPanel.hidden = !open;
    document.body.classList.toggle('collections-open', open);
    collectionsBtn.classList.toggle('active', open);
    savePref(OPEN_KEY, open ? '1' : '0');
    if (open) refreshCollectionsPanel();
  }
  collectionsBtn.addEventListener('click', () => toggleCollectionsPanel(collectionsPanel.hidden));
  document.getElementById('collectionsClose').addEventListener('click', () => toggleCollectionsPanel(false));
  // Keep the open panel's counts and current collection up to date.
  function refreshPanelIfOpen() { if (!collectionsPanel.hidden) refreshCollectionsPanel(); }

  setDock(loadPref(DOCK_KEY));
  if (loadPref(OPEN_KEY) === '1') toggleCollectionsPanel(true);

  newCollectionForm.addEventListener('submit', async e => {
    e.preventDefault();
    const name = newCollectionName.value.trim();
    if (!name) return;
    try {
      await collectionsApi('POST', '/api/collections', { name, description: newCollectionDescription.value });
      newCollectionName.value = '';
      newCollectionDescription.value = '';
      clearInlineError(newCollectionForm);
      refreshCollectionsPanel();
    } catch (err) { showInlineError(newCollectionForm, err.message); }
  });

  // The "+ Collection" menu on a result: tick or untick each collection,
  // or create one with this result in it.
  function closeCollectMenus() {
    document.querySelectorAll('.collect-menu').forEach(m => m.remove());
  }
  document.addEventListener('click', e => { if (!e.target.closest('.collect-wrap')) closeCollectMenus(); });

  async function openCollectMenu(wrap, docId) {
    closeCollectMenus();
    const menu = document.createElement('div');
    menu.className = 'collect-menu';
    menu.innerHTML = '<em>Loading…</em>';
    wrap.appendChild(menu);
    // A view of this collection changes when its items do.
    const changed = id => {
      if (openCollection && openCollection.id === id) loadPage(currentStart);
      refreshPanelIfOpen();
    };

    async function render() {
      const { collections } = await collectionsApi('GET', `/api/collections?doc=${encodeURIComponent(docId)}`);
      menu.innerHTML = collections.length ? '' : '<div class="collections-empty">No collections yet.</div>';
      for (const c of collections) {
        const label = document.createElement('label');
        label.innerHTML = `<input type="checkbox" ${c.contains ? 'checked' : ''}> ${escapeHtml(c.name)}<span class="count">${c.count}</span>`;
        const box = label.querySelector('input');
        box.addEventListener('change', async () => {
          try {
            if (box.checked) await collectionsApi('POST', `/api/collections/${c.id}/items`, { id: docId });
            else await collectionsApi('DELETE', `/api/collections/${c.id}/items?id=${encodeURIComponent(docId)}`);
            clearInlineError(menu);
            changed(c.id);
          } catch (err) {
            box.checked = !box.checked;
            showInlineError(menu, err.message);
          }
        });
        menu.appendChild(label);
      }
      const form = document.createElement('form');
      form.className = 'collection-new';
      form.innerHTML = '<input type="text" placeholder="New collection" maxlength="100" autocomplete="off"><button type="submit">Add</button>';
      form.addEventListener('submit', async e => {
        e.preventDefault();
        const name = form.querySelector('input').value.trim();
        if (!name) return;
        try {
          const created = await collectionsApi('POST', '/api/collections', { name });
          await collectionsApi('POST', `/api/collections/${created.id}/items`, { id: docId });
          await render();
          refreshPanelIfOpen();
        } catch (err) { showInlineError(form, err.message); }
      });
      menu.appendChild(form);
    }
    try { await render(); } catch (err) { menu.innerHTML = `<em>${escapeHtml(err.message)}</em>`; }
  }

  // Selecting results to add together. The selection lasts across pages and
  // searches until it's added or cleared.
  const selectedDocs = new Set();
  let lastChecked = null;       // the checkbox a Shift-click selects a run from
  const selectBar = document.getElementById('selectBar');
  const selectCount = document.getElementById('selectCount');
  const selectPageBtn = document.getElementById('selectPage');
  const selectClearBtn = document.getElementById('selectClear');
  const selectAddBtn = document.getElementById('selectAdd');
  const selectAddAllBtn = document.getElementById('selectAddAll');
  const selectMessage = document.getElementById('selectMessage');
  const pageChecks = () => [...resultsEl.querySelectorAll('.result-check')];
  const plural = (n, word) => `${n.toLocaleString()} ${word}${n === 1 ? '' : 's'}`;

  function setChecked(check, on) {
    check.checked = on;
    check.closest('.result').classList.toggle('selected', on);
    if (on) selectedDocs.add(check.dataset.id);
    else selectedDocs.delete(check.dataset.id);
  }

  function updateSelectBar() {
    const checks = pageChecks();
    const n = selectedDocs.size;
    selectBar.hidden = !checks.length && !n && selectMessage.hidden;
    selectBar.classList.toggle('has-selection', n > 0);
    selectCount.textContent = n ? `${n.toLocaleString()} selected` : 'Tick results to select them';
    selectPageBtn.hidden = !checks.length;
    selectPageBtn.textContent = checks.length && checks.every(c => c.checked) ? 'Unselect page' : 'Select page';
    selectClearBtn.hidden = !n;
    selectAddBtn.hidden = !n;
    // Only a search has a set of results to add: a collection's documents are
    // already in one, and "more like these" isn't a search that can be re-run.
    const canAddAll = !openCollection && hasSearched && currentTotal > 0;
    selectAddAllBtn.hidden = !canAddAll;
    if (canAddAll) selectAddAllBtn.textContent = `Add all ${currentTotal.toLocaleString()} results`;
  }

  resultsEl.addEventListener('click', e => {
    const check = e.target.closest('.result-check');
    if (!check) return;
    if (e.shiftKey && lastChecked && lastChecked.isConnected) {
      const checks = pageChecks();
      const [a, b] = [checks.indexOf(lastChecked), checks.indexOf(check)];
      checks.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(c => setChecked(c, check.checked));
    } else {
      setChecked(check, check.checked);
    }
    lastChecked = check;
    updateSelectBar();
  });
  selectPageBtn.addEventListener('click', () => {
    const checks = pageChecks();
    const on = !checks.every(c => c.checked);
    checks.forEach(c => setChecked(c, on));
    updateSelectBar();
  });
  selectClearBtn.addEventListener('click', () => {
    selectedDocs.clear();
    pageChecks().forEach(c => setChecked(c, false));
    updateSelectBar();
  });

  // After a bulk add: what happened, with a way to take it back.
  function showBulkResult(collection, result) {
    const notes = [];
    if (result.already) notes.push(`${result.already.toLocaleString()} already in it`);
    if (result.unavailable) notes.push(`${result.unavailable.toLocaleString()} you can no longer open`);
    let text = `Added ${plural(result.added.length, 'document')} to "${collection.name}"`;
    if (notes.length) text += ` (${notes.join(', ')})`;
    text += '.';
    if (result.over || result.more) text += ` The rest weren't added: a collection holds up to ${maxCollectionItems.toLocaleString()} documents.`;
    selectMessage.textContent = text;
    selectMessage.hidden = false;
    if (result.added.length) {
      const undo = document.createElement('button');
      undo.type = 'button';
      undo.textContent = 'Undo';
      undo.addEventListener('click', async () => {
        try {
          await collectionsApi('POST', `/api/collections/${collection.id}/items/bulk-remove`, { ids: result.added });
          selectMessage.textContent = `Removed those ${plural(result.added.length, 'document')} from "${collection.name}".`;
          collectionChanged(collection.id);
        } catch (err) { selectMessage.textContent = `Couldn't undo that: ${err.message}`; }
      });
      selectMessage.appendChild(undo);
    }
    updateSelectBar();
  }

  function collectionChanged(id) {
