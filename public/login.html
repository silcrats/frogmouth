<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frogmouth Search — Sign in</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f25;
    --border: #2a2e36;
    --text: #e6e8eb;
    --text-dim: #8b909c;
    --accent: #5fb3a3;
    --accent-dim: #3d7a70;
    --err: #d97070;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px;
  }
  .label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
    text-align: center;
  }
  h1 { font-size: 22px; margin: 0 0 24px; font-weight: 600; text-align: center; }
  label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 15px;
    padding: 11px 14px;
    border-radius: 6px;
    font-family: var(--sans);
    margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: var(--accent-dim); }
  button {
    width: 100%;
    background: var(--accent);
    color: #0d1210;
    border: none;
    font-weight: 600;
    font-size: 14px;
    padding: 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #6fc2b2; }
  button:disabled { background: var(--border); color: var(--text-dim); cursor: default; }
  .error {
    color: var(--err);
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .logo {
    display: block;
    max-width: 180px;
    margin: 0 auto 24px;
  }
</style>
</head>
<body>
<div class="card">
  <img class="logo" alt="" style="display:none;">
  <div class="label">Frogmouth Search</div>
  <h1>Sign in with your domain account</h1>
  <div class="error" id="error"></div>
  <form id="loginForm">
    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">Sign in</button>
  </form>
</div>
<script>
  fetch('/api/config').then(r => r.json()).then(cfg => {
    const app = cfg.app || {};
    const logo = document.querySelector('.card .logo');
    if (app.logo) {
      logo.src = app.logo;
      logo.alt = app.title || '';
      logo.style.display = '';
    }
    if (!app.title) return;
    document.title = `${app.title} — Sign in`;
    document.querySelector('.card .label').textContent = app.title;
  }).catch(() => { /* keep the built-in title */ });

  const form = document.getElementById('loginForm');
  const errorEl = document.getElementById('error');
  const btn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');
      window.location.href = '/';
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
