# Example deployment of Frogmouth in front of an existing OpenSearch index
# (e.g. one fed by Pelican).
#
#   cp .env.example .env            # LDAP, session secret, SMB credentials
#   cp /path/to/pelican/config/shares.yaml ./shares.yaml   # for downloads
#   docker compose -f docker-compose.example.yml up -d --build
#
# This joins the network and certs volume of Pelican's compose example,
# whose OpenSearch serves HTTPS with its own CA. Docker names them after
# Pelican's compose project, `pelican` if it runs from a directory of that
# name (check with `docker network ls` / `docker volume ls`). Start Pelican
# first; set OS_PASSWORD in .env to Pelican's OS_READER_PASSWORD.

services:
  frogmouth:
    build: .
    container_name: frogmouth
    env_file: .env
    environment:
      SHARES_CONFIG: /app/shares.yaml
      OS_CA_CERTS: /certs/ca.pem
    volumes:
      # Pelican's CA, to verify OpenSearch's certificate.
      - certs:/certs:ro
      # SMB server/share definitions for downloads; omit to disable them.
      - ./shares.yaml:/app/shares.yaml:ro
      # Optional: your own config.yaml, and a logo for app.logo.
      # - ./config.local/config.yaml:/app/config.yaml:ro
      # - ./branding:/app/public/branding:ro
    ports:
      - "3000:3000"
    networks: [search]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    restart: unless-stopped

networks:
  search:
    external: true
    name: pelican_search

volumes:
  certs:
    external: true
    name: pelican_certs
