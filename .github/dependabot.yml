# Weekly dependency update PRs. Minor and patch updates are grouped into one
# PR per ecosystem; each major update gets its own PR, since those can break
# things a build alone won't catch. The publish workflow builds every PR
# (without pushing), so a broken build shows up as a failed check.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Stay on the current Node LTS line; bump the major by hand.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
